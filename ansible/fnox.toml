[secrets]
# atlas (CA)
ATLAS_INTERMEDIATE_CA_KEY = { provider = "op", value = "X Intermediate CA/intermediate_ca_key.enc.pem" }
ATLAS_INTERMEDIATE_CA_PASSWORD = { provider = "op", value = "X Intermediate CA/password" }

# unity (UniFi controller)
UNITY_MONGO_ROOT_PASSWORD = { provider = "op", value = "Unity MongoDB/root-password" }
UNITY_MONGO_PASSWORD = { provider = "op", value = "Unity MongoDB/unifi-password" }

# polaris (DNS — TSIG key for ACME DDNS, shared with harmony's lego)
POLARIS_TSIG_SECRET = { provider = "op", value = "Polaris TSIG/secret" }

# echo (MQTT broker) — per-client credentials, shared with gaia and rosetta
ECHO_GAIA_PASSWORD = { provider = "op", value = "echo.x/gaia-password" }
ECHO_ROSETTA_PASSWORD = { provider = "op", value = "echo.x/rosetta-password" }

# rosetta (Zigbee2MQTT — Zigbee mesh encryption key, 16 comma-separated bytes)
ROSETTA_ZIGBEE_NETWORK_KEY = { provider = "op", value = "rosetta.x/network-key" }

# andromeda (qBittorrent egress — Mullvad WireGuard, generated in the Mullvad
# account UI; arr API keys pinned into the apps and shared with recyclarr)
ANDROMEDA_WIREGUARD_PRIVATE_KEY = { provider = "op", value = "andromeda.x/wireguard-private-key" }
ANDROMEDA_WIREGUARD_ADDRESSES = { provider = "op", value = "andromeda.x/wireguard-addresses" }
ANDROMEDA_RADARR_API_KEY = { provider = "op", value = "andromeda.x/radarr-api-key" }
ANDROMEDA_RADARR_FR_API_KEY = { provider = "op", value = "andromeda.x/radarr-fr-api-key" }
ANDROMEDA_SONARR_API_KEY = { provider = "op", value = "andromeda.x/sonarr-api-key" }
ANDROMEDA_PROWLARR_API_KEY = { provider = "op", value = "andromeda.x/prowlarr-api-key" }

# janus (Authelia)
JANUS_SESSION_SECRET = { provider = "op", value = "janus.x/session-secret" }
JANUS_STORAGE_ENCRYPTION_KEY = { provider = "op", value = "janus.x/storage-encryption-key" }
JANUS_RESET_JWT_SECRET = { provider = "op", value = "janus.x/reset-jwt-secret" }

# tycho (lldap) — janus-password is the Authelia bind account, shared with janus;
# andromeda-password is Jellyfin's LDAP bind account (entered in its plugin UI)
TYCHO_JWT_SECRET = { provider = "op", value = "tycho.x/jwt-secret" }
TYCHO_KEY_SEED = { provider = "op", value = "tycho.x/key-seed" }
TYCHO_ADMIN_PASSWORD = { provider = "op", value = "tycho.x/admin-password" }
TYCHO_JANUS_PASSWORD = { provider = "op", value = "tycho.x/janus-password" }
TYCHO_ANDROMEDA_PASSWORD = { provider = "op", value = "tycho.x/andromeda-password" }
TYCHO_XEHOS_PASSWORD = { provider = "op", value = "tycho.x/password" }
TYCHO_XEHOS_EMAIL = { provider = "op", value = "tycho.x/username" }
