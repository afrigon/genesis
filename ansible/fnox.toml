[secrets]
# atlas (CA)
ATLAS_INTERMEDIATE_CA_KEY = { provider = "op", value = "X Intermediate CA/intermediate_ca_key.enc.pem" }
ATLAS_INTERMEDIATE_CA_PASSWORD = { provider = "op", value = "X Intermediate CA/password" }

# unity (UniFi controller)
UNITY_MONGO_ROOT_PASSWORD = { provider = "op", value = "Unity MongoDB/root-password" }
UNITY_MONGO_PASSWORD = { provider = "op", value = "Unity MongoDB/unifi-password" }

# polaris (DNS — TSIG key for ACME DDNS, shared with harmony's lego)
POLARIS_TSIG_SECRET = { provider = "op", value = "Polaris TSIG/secret" }

# echo (MQTT broker) — per-client credentials, shared with gaia and rosetta
ECHO_GAIA_PASSWORD = { provider = "op", value = "echo/gaia-password" }
ECHO_ROSETTA_PASSWORD = { provider = "op", value = "echo/rosetta-password" }

# rosetta (Zigbee2MQTT — Zigbee mesh encryption key, 16 comma-separated bytes)
ROSETTA_ZIGBEE_NETWORK_KEY = { provider = "op", value = "rosetta/network-key" }

# andromeda (qBittorrent egress — Mullvad WireGuard, generated in the Mullvad
# account UI; arr API keys pinned into the apps and shared with recyclarr)
ANDROMEDA_WIREGUARD_PRIVATE_KEY = { provider = "op", value = "andromeda/wireguard-private-key" }
ANDROMEDA_WIREGUARD_ADDRESSES = { provider = "op", value = "andromeda/wireguard-addresses" }
ANDROMEDA_RADARR_API_KEY = { provider = "op", value = "andromeda/radarr-api-key" }
ANDROMEDA_RADARR_FR_API_KEY = { provider = "op", value = "andromeda/radarr-fr-api-key" }
ANDROMEDA_SONARR_API_KEY = { provider = "op", value = "andromeda/sonarr-api-key" }
ANDROMEDA_PROWLARR_API_KEY = { provider = "op", value = "andromeda/prowlarr-api-key" }

# janus (Authelia) — the OIDC digest is derived from voyager's plaintext
# client secret (same item), which is entered in voyager's authentication UI
JANUS_SESSION_SECRET = { provider = "op", value = "janus/session-secret" }
JANUS_STORAGE_ENCRYPTION_KEY = { provider = "op", value = "janus/storage-encryption-key" }
JANUS_RESET_JWT_SECRET = { provider = "op", value = "janus/reset-jwt-secret" }
JANUS_OIDC_HMAC_SECRET = { provider = "op", value = "janus/oidc-hmac-secret" }
JANUS_OIDC_JWKS_KEY = { provider = "op", value = "janus/oidc-jwks-key" }
JANUS_OIDC_VOYAGER_CLIENT_SECRET_DIGEST = { provider = "op", value = "voyager/oidc-client-secret-digest" }

# tycho (lldap) — janus-password is the Authelia bind account, shared with janus;
# andromeda-password is Jellyfin's LDAP bind account (entered in its plugin UI)
TYCHO_JWT_SECRET = { provider = "op", value = "tycho/jwt-secret" }
TYCHO_KEY_SEED = { provider = "op", value = "tycho/key-seed" }
TYCHO_ADMIN_PASSWORD = { provider = "op", value = "tycho/admin-password" }
TYCHO_JANUS_PASSWORD = { provider = "op", value = "tycho/janus-password" }
TYCHO_ANDROMEDA_PASSWORD = { provider = "op", value = "tycho/andromeda-password" }
TYCHO_XEHOS_PASSWORD = { provider = "op", value = "tycho/password" }
TYCHO_XEHOS_EMAIL = { provider = "op", value = "tycho/username" }
