---
- name: Create voyager project directories
  ansible.builtin.file:
    path: "{{ services_root }}/voyager/{{ item }}"
    state: directory
    owner: "1000"
    group: "1000"
    mode: "0750"
  loop:
    - config
    - metadata

- name: Deploy compose file
  ansible.builtin.copy:
    src: compose.yaml
    dest: "{{ services_root }}/voyager/compose.yaml"
    mode: "0640"

- name: Render environment file
  ansible.builtin.template:
    src: voyager.env.j2
    dest: "{{ services_root }}/voyager/.env"
    mode: "0640"

- name: Deploy voyager
  community.docker.docker_compose_v2:
    project_src: "{{ services_root }}/voyager"
    pull: missing
    remove_orphans: true
